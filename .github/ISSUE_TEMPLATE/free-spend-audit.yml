name: Private scan request
description: Ask for a free agent-spend audit without posting your records publicly.
title: "[private scan] "
labels: ["free-scan"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public. Do not paste spend records, invoices, transaction lists, keys,
        customer data, or anything you would not publish.**

        The free audit itself runs in your browser and nothing is uploaded:
        https://mrpkk.github.io/nidhipati/free-spend-audit.html

        Open this issue with the question only. We reply here and arrange a private channel
        for the report or the file. If the browser tool already answers your question, you
        do not need us.
  - type: textarea
    id: question
    attributes:
      label: What do you want answered?
    validations:
      required: true
  - type: input
    id: spend
    attributes:
      label: Roughly how much do your agents spend a month?
      placeholder: "e.g. 2,000 USDC"
  - type: input
    id: providers
    attributes:
      label: Which providers bill you?
      placeholder: "e.g. OpenAI, Anthropic, x402 endpoints, a tool marketplace"
  - type: dropdown
    id: access
    attributes:
      label: Can you share provider invoices (not just your own records)?
      options:
        - "Yes, I can share invoices privately"
        - "Only my own records for now"
        - "Not sure yet"
  - type: dropdown
    id: source
    attributes:
      label: Where did you find this? (optional, honest answer)
      description: Attribution we cannot fake — if you skip it, we simply do not know.
      options:
        - "Hacker News"
        - "Reddit"
        - "GitHub search or a catalog"
        - "A colleague sent it"
        - "Other"
  - type: checkboxes
    id: honesty
    attributes:
      label: Before you send
      options:
        - label: I did not paste records, keys, or customer data into this public issue.
          required: true
        - label: I understand this is an estimate from my records, not a legal or statutory audit.
          required: true
