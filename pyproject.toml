[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nidhipati-proof"
version = "0.6.0"
description = "Proof of Spend for AI agents: verify mandate, amount, asset, network, payee and refund in a signed receipt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mrpkk" }]
keywords = ["ai-agents", "payments", "x402", "proof-of-spend", "audit"]
dependencies = [
  "jsonschema>=4.0",
  "cryptography>=41"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nidhipati-proof = "nidhipati_proof.cli:main"
nidhipati-spend = "nidhipati_proof.spend_cli:main"
nidhipati-reserve = "nidhipati_proof.reserve_cli:main"
nidhipati-resolve = "nidhipati_proof.resolve_cli:main"
nidhipati-reconcile = "nidhipati_proof.reconcile_cli:main"
nidhipati-mcp = "nidhipati_proof.mcp_stdio:main"

[tool.setuptools.packages.find]
include = ["nidhipati_proof*"]

[tool.setuptools.package-data]
nidhipati_proof = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
